name: "Promote"

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Tag ou digest da imagem a promover, por exemplo sso-service-production ou sha256:abc..."
        required: true
        type: string
      ambiente:
        description: "Ambiente de destino"
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: promote-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promover:
    name: "Promover ${{ inputs.versao }} para ${{ inputs.ambiente }}"
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.ambiente }}

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: "Autenticar no registro"
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Resolver a versão para um digest imutável"
        id: digest
        run: |
          set -euo pipefail
          imagem="ghcr.io/${{ github.repository }}"
          entrada="${{ inputs.versao }}"
          if [[ "$entrada" == sha256:* ]]; then
            referencia="${imagem}@${entrada}"
          else
            referencia="${imagem}:${entrada}"
          fi
          digest=$(docker buildx imagetools inspect "$referencia" --format '{{ .Manifest.Digest }}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "referencia=$referencia" >> "$GITHUB_OUTPUT"
          echo "$referencia resolve para $digest"

      - name: "Escrever o digest no manifesto do ambiente"
        id: escrita
        run: |
          set -euo pipefail
          arquivo="gitops/apps/sso/values-${{ inputs.ambiente }}.yaml"
          python3 - "$arquivo" "${{ inputs.versao }}" "${{ steps.digest.outputs.digest }}" <<'PY'
          import sys, yaml, pathlib
          arquivo, versao, digest = sys.argv[1], sys.argv[2], sys.argv[3]
          p = pathlib.Path(arquivo)
          d = yaml.safe_load(p.read_text())
          imagem = d["application"]["deployment"]["image"]
          anterior = imagem.get("tag")
          rotulo = versao.split("@")[0] if not versao.startswith("sha256:") else "promovido"
          imagem["tag"] = f"{rotulo}@{digest}"
          imagem["pullPolicy"] = "IfNotPresent"
          p.write_text(yaml.safe_dump(d, default_flow_style=False, sort_keys=True, allow_unicode=True, width=100))
          print(f"::notice::tag anterior: {anterior}")
          print(f"::notice::tag nova: {imagem['tag']}")
          PY
          if git diff --quiet -- "$arquivo"; then
            echo "sem_mudanca=true" >> "$GITHUB_OUTPUT"
            echo "::notice::o ambiente já está nessa versão, nada a commitar"
          else
            echo "sem_mudanca=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commitar a promoção"
        if: steps.escrita.outputs.sem_mudanca == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/sso/values-${{ inputs.ambiente }}.yaml
          git commit -m "chore(gitops): promote ${{ inputs.versao }} to ${{ inputs.ambiente }}"
          git push origin HEAD:main
