name: "Promote"

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest da imagem a promover, no formato sha256:..."
        required: true
        type: string
      ambiente:
        description: "Ambiente de destino"
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: promote-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promover:
    name: "Promover para ${{ inputs.ambiente }}"
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.ambiente }}

    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: true

      - name: "Conferir o formato do digest"
        run: |
          set -euo pipefail
          if ! [[ "${{ inputs.digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::digest invalido, esperado sha256 seguido de 64 caracteres hexadecimais"
            exit 1
          fi

      - name: "Autenticar no registro"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Conferir que o digest existe no registro"
        run: |
          set -euo pipefail
          arquivo="gitops/apps/sso/values-${{ inputs.ambiente }}.yaml"
          repositorio=$(python3 -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['application']['deployment']['image']['repository'])" "$arquivo")
          referencia="${repositorio}@${{ inputs.digest }}"
          docker buildx imagetools inspect "$referencia" --format '{{ .Manifest.MediaType }}'
          echo "::notice::$referencia existe no registro"

      - name: "Escrever o digest no manifesto do ambiente"
        id: escrita
        run: |
          set -euo pipefail
          arquivo="gitops/apps/sso/values-${{ inputs.ambiente }}.yaml"
          python3 - "$arquivo" "${{ inputs.digest }}" <<'PY'
          import sys, yaml, pathlib
          arquivo, digest = sys.argv[1], sys.argv[2]
          p = pathlib.Path(arquivo)
          d = yaml.safe_load(p.read_text())
          imagem = d["application"]["deployment"]["image"]
          anterior = imagem.get("digest") or imagem.get("tag")
          imagem.pop("tag", None)
          imagem["digest"] = digest
          imagem["pullPolicy"] = "IfNotPresent"
          p.write_text(yaml.safe_dump(d, default_flow_style=False, sort_keys=True, allow_unicode=True, width=100))
          print(f"::notice::antes: {anterior}")
          print(f"::notice::depois: {digest}")
          PY
          if git diff --quiet -- "$arquivo"; then
            echo "sem_mudanca=true" >> "$GITHUB_OUTPUT"
          else
            echo "sem_mudanca=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Commitar a promocao"
        if: steps.escrita.outputs.sem_mudanca == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "gitops/apps/sso/values-${{ inputs.ambiente }}.yaml"
          git commit -m "chore(gitops): promote ${{ inputs.digest }} to ${{ inputs.ambiente }}"
          git push origin HEAD:main
