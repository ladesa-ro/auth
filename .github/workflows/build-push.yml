name: "Build & Push"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - gitops/**
      - README.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: "Build and Push"
    runs-on: ubuntu-latest

    permissions:
      packages: write

    environment:
      name: production

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Login into Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ${{ vars.REGISTRY_GHCR == 'true' && 'ghcr.io' || secrets.REGISTRY_URL }}
          username: ${{ vars.REGISTRY_GHCR == 'true' && github.actor || secrets.REGISTRY_USERNAME }}
          password: ${{ vars.REGISTRY_GHCR == 'true' && secrets.GITHUB_TOKEN || secrets.REGISTRY_TOKEN }}

      - name: Build and push container image to the registry
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          push: true
          tags: ${{ vars.REGISTRY_GHCR == 'true' && 'ghcr.io' || secrets.REGISTRY_URL }}/${{ vars.BUILD_IMAGE_NAME_SSO_SERVICE }}:${{ vars.BUILD_IMAGE_TAG }}
          target: sso-runtime
